version: '3.8'
services:
  ollama:
    build:
      context: .
      dockerfile: "./ollama/Dockerfile"
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    mem_limit: 8g
    networks:
      - book_gen_nt
    container_name: ollama

  book_gen_app:
    build:
      context: .
      dockerfile: "./app/Dockerfile"
    ports:
      - "8501:8501"
      - "9000:9000"
    depends_on:
      - ollama
      - qdrant
    environment:
      - OLLAMA_URI=http://ollama:11434
      - QDRANT_URI=http://qdrant:6333
    networks:
      - book_gen_nt
    container_name: book_gen_app

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - book_gen_nt
    container_name: qdrant

volumes:
  ollama_data:
  qdrant_data:

networks:
  book_gen_nt:
    driver: bridge
