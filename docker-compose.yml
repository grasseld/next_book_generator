version: '3.8'
services:
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_MODEL=llama2
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - book_gen_nt
    container_name: ollama

  book_gen_app:
    build:
      context: .
      dockerfile: "./app/Dockerfile"
    ports:
      - "8501:8501"
    depends_on:
      - ollama
      - qdrant
    environment:
      - STREAMLIT_OLLAMA_URL=http://ollama:11434
      - STREAMLIT_QDRANT_URL=http://qdrant:6333
    networks:
      - book_gen_nt
    container_name: book_gen_app

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - book_gen_nt
    container_name: qdrant

volumes:
  ollama_data:
  qdrant_data:

networks:
  book_gen_nt:
    driver: bridge
